# Netlify configuration for LIMONADA (Vite + React + Supabase)
# Deploy: Netlify via GitHub ("Import from Git") o drag-and-drop de dist/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Evita fallo de peer deps (vite@8 / esbuild) en CI
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Variables requeridas (definirlas en Netlify UI -> Environment variables):
# VITE_SUPABASE_URL
# VITE_SUPABASE_ANON_KEY
